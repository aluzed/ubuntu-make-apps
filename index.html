<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ubuntu Make Apps</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container-fluid py-4">
    <div class="row">
      <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h1 class="mb-0 d-flex align-items-center">
            <img src="assets/UMA.png" alt="UMA Logo" class="app-logo me-3">
            Ubuntu Make Apps
          </h1>
          <div class="btn-group">
            <button id="btnSettings" class="btn btn-secondary" title="Manage ignore patterns">
              <i class="bi bi-gear"></i>
              Settings
            </button>
            <button id="btnAdd" class="btn btn-primary" title="Add a new application">
              <i class="bi bi-plus-circle"></i>
              Add
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- List View -->
    <div id="viewList" class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <div id="appList" class="list-group">
              <!-- Applications will be loaded here -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Form View -->
    <div id="viewForm" class="row" style="display: none;">
      <div class="col-12">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0" id="formTitle">New Application</h5>
            <button id="btnBack" class="btn btn-sm btn-secondary" title="Go back to applications list">
              <i class="bi bi-arrow-left"></i>
              Back
            </button>
          </div>
          <div class="card-body">
            <form id="appForm">
              <input type="hidden" id="appId">
              <input type="hidden" id="currentUser">

              <!-- Type -->
              <div class="mb-3">
                <label for="appType" class="form-label">Type</label>
                <select id="appType" class="form-select" required>
                  <option value="Application">Application</option>
                  <option value="Directory">Directory</option>
                </select>
              </div>

              <!-- Name -->
              <div class="mb-3">
                <label for="appName" class="form-label">Name</label>
                <input type="text" class="form-control" id="appName" required>
              </div>

              <!-- File/Folder -->
              <div class="mb-3">
                <label for="appExec" class="form-label" id="labelExec">AppImage File</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="appExec" readonly required>
                  <button type="button" class="btn btn-outline-secondary" id="btnSelectExec" title="Select AppImage file or folder">
                    <i class="bi bi-folder2-open"></i>
                    Browse
                  </button>
                </div>
                <input type="hidden" id="appExecSource">
              </div>

              <!-- Icon -->
              <div class="mb-3">
                <label for="appIcon" class="form-label">Icon</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="appIcon" readonly required>
                  <button type="button" class="btn btn-outline-secondary" id="btnSelectIcon" title="Select an icon image file">
                    <i class="bi bi-image"></i>
                    Browse
                  </button>
                </div>
                <input type="hidden" id="appIconSource">
                <div id="iconPreview" class="mt-2"></div>
              </div>

              <!-- Categories -->
              <div class="mb-3">
                <label for="appCategories" class="form-label">Categories</label>
                <input type="text" class="form-control" id="appCategories" placeholder="Utility;IDE;" required>
                <small class="form-text text-muted">Separate categories with semicolons</small>
              </div>

              <!-- Buttons -->
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success" title="Save this application">
                  <i class="bi bi-check-circle"></i>
                  Save
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="settingsModalLabel">Ignore Patterns Settings</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="text-muted">Manage patterns to ignore when listing .desktop files. Use * as wildcard.</p>
            <div class="mb-3">
              <div class="input-group">
                <input type="text" class="form-control" id="newPatternInput" placeholder="e.g., wine-extension-*">
                <button class="btn btn-success" type="button" id="btnAddPattern">
                  <i class="bi bi-plus"></i> Add
                </button>
              </div>
            </div>
            <div id="patternsList" class="list-group">
              <!-- Patterns will be loaded here -->
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App JS -->
  <script src="renderer.js"></script>
</body>
</html>
